<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Audio Player</title>
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo">CheengizsAudio</div>

        <div class="search-bar">
          <input
            type="text"
            placeholder="Search for songs, artists, albums..."
          />
        </div>

        <div class="user-actions">
          <button class="icon-btn" aria-label="Favorites">♥</button>
          <div class="user-avatar">U</div>
        </div>
      </header>

      <main class="main-content">
        <section class="content-section">
          <div class="section-header">
            <h1 class="section-title">Audios</h1>
          </div>

          <div class="grid-container" id="audio-container"></div>
        </section>

        <section class="content-section">
          <div class="section-header">
            <h2 class="section-title">playlists</h2>
          </div>

          <div class="grid-container" id="playlist-container"></div>
        </section>

        <section class="content-section">
          <div class="section-header">
            <h2 class="section-title">users</h2>
          </div>

          <div class="grid-container" id="user-container"></div>
        </section>
      </main>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
